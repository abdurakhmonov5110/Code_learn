<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulyator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #0f172a;
    }

    .calculator {
      width: 320px;
      background: #1e293b;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .display {
      width: 100%;
      height: 70px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      color: #f8fafc;
      font-size: 32px;
      text-align: right;
      padding: 0 16px;
      margin-bottom: 20px;
      outline: none;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 56px;
      border: none;
      border-radius: 12px;
      background: #334155;
      color: #f8fafc;
      font-size: 20px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    button:hover {
      background: #475569;
    }

    button:active {
      transform: scale(0.95);
    }

    button.operator {
      background: #6366f1;
      color: white;
    }

    button.operator:hover {
      background: #4f46e5;
    }

    button.action {
      background: #ef4444;
      color: white;
    }

    button.action:hover {
      background: #dc2626;
    }

    button.equal {
      background: #10b981;
      grid-column: span 2;
    }

    button.equal:hover {
      background: #059669;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <input type="text" class="display" id="display" readonly value="0">
    <div class="keys">
      <button class="action" onclick="clearDisplay()">C</button>
      <button class="action" onclick="deleteLast()">DEL</button>
      <button class="operator" onclick="appendValue('/')">÷</button>
      <button class="operator" onclick="appendValue('*')">×</button>

      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button class="operator" onclick="appendValue('-')">-</button>

      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button class="operator" onclick="appendValue('+')">+</button>

      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button onclick="appendValue('.')">.</button>

      <button onclick="appendValue('0')">0</button>
      <button class="equal" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');

    function appendValue(val) {
      if (display.value === '0' && val !== '.') {
        display.value = val;
      } else {
        display.value += val;
      }
    }

    function clearDisplay() {
      display.value = '0';
    }

    function deleteLast() {
      display.value = display.value.slice(0, -1);
      if (display.value === '') {
        display.value = '0';
      }
    }

    function calculate() {
      try {
        const result = Function('"use strict";return (' + display.value + ')')();
        display.value = Number.isFinite(result) ? result : 'Xato';
      } catch (e) {
        display.value = 'Xato';
      }
    }
  </script>

</body>
</html>
